name: Check new videos

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: check-new-videos
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 生成した要約テキストなどの状態は git にコミットせず、リポジトリ外からは
      # 見えない Actions キャッシュに保存する（public リポジトリの履歴に
      # AI生成コンテンツを残さないため）。
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-cache-${{ github.run_id }}
          restore-keys: |
            state-cache-

      - name: Run check_new_videos.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python check_new_videos.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-cache-${{ github.run_id }}
