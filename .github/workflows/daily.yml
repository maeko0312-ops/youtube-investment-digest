name: Daily investment digest

on:
  schedule:
    # 20:00 UTC = 5:00 JST（GitHub Actionsの仕様上、実際の実行は数分〜数十分ずれることがある）
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-investment-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # check.yml と同じキャッシュ領域を共有し、直近の要約データを読む。
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-cache-${{ github.run_id }}
          restore-keys: |
            state-cache-

      - name: Run daily_digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python daily_digest.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-cache-${{ github.run_id }}
